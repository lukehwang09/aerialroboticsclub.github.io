<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subteam — Ithaca Aerial</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><style>:root{--ink:#071319;--paper:#e9ece8;--lime:#ceff43;--mono:'DM Mono',monospace;--sans:Manrope,sans-serif;--display:'Space Grotesk',sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}a{color:inherit;text-decoration:none}.shell{width:min(1240px,calc(100% - 48px));margin:auto}.mono{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase}.top{background:var(--ink);color:white}.nav{height:80px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:10px;align-items:center;font:700 17px var(--display)}.mark{width:28px;height:28px;border:1px solid var(--lime);color:var(--lime);border-radius:50%;display:grid;place-items:center}.back{color:var(--lime);font:500 10px var(--mono);letter-spacing:.1em}.hero{padding:66px 0 75px;border-top:1px solid rgba(255,255,255,.15)}.hero h1{font:700 clamp(58px,9vw,126px)/.84 var(--display);letter-spacing:-.1em;margin:15px 0}.eyebrow{color:var(--lime);display:flex;align-items:center;gap:10px}.eyebrow:before{content:'';width:20px;height:1px;background:currentColor}.hero p{max-width:600px;color:#c4d4cf;line-height:1.8;margin:0}.main{padding:72px 0}.layout{display:grid;grid-template-columns:1fr 1fr;gap:60px}.main h2{font:600 clamp(32px,4vw,53px)/.95 var(--display);letter-spacing:-.07em;margin:0 0 18px}.main p{line-height:1.8;color:#53645f;font-size:14px}.list{border-top:1px solid #b4c0bc;margin-top:25px}.list div{border-bottom:1px solid #b4c0bc;padding:17px 0}.list b{font-size:14px}.list p{margin:5px 0 0;font-size:12px}.roster{background:#d6dedb;padding:30px}.roster h2{margin-bottom:12px}.member{padding:16px 0;border-top:1px solid #b4c0bc;display:flex;justify-content:space-between;gap:12px;font-size:13px}.member span{color:#63736e}.note{font-size:12px;color:#5a6b66;line-height:1.7;margin-top:18px}@media(max-width:700px){.shell{width:min(100% - 34px,1240px)}.nav{height:66px}.hero{padding:55px 0}.main{padding:55px 0}.layout{grid-template-columns:1fr;gap:35px}}</style></head><body><header class="top"><div class="shell nav"><a class="brand" href="index.html"><span class="mark">+</span>Ithaca Aerial</a><a class="back" href="subteams.html">← All subteams</a></div><div class="shell hero"><div class="eyebrow mono" id="label">Subteam</div><h1 id="title">Electrical</h1><p id="intro"></p></div></header><main class="shell main"><div class="layout"><section><h2>What this team owns.</h2><p id="description"></p><div class="list" id="areas"></div></section><aside class="roster"><div class="mono" style="color:#718000">Team roster</div><h2>People in this team.</h2><div id="members"></div><p class="note">Team membership will be added here as the club grows. Interested members can begin with any team and collaborate across the flight line.</p></aside></div></main><script>const teams={airframe:{label:'01 / Structure',title:'Airframe & Structures',intro:'The team that turns a mission need into a physical aircraft.',description:'Airframe & Structures owns the 3D-printable fixed-wing platform: its shape, structure, assembly, and durability. The team balances weight, strength, manufacturability, and access for the electronics and test teams.',areas:[['CAD & configuration','Model the aircraft, choose layouts, and iterate from requirements.'],['3D printing & assembly','Prepare printable parts, manage tolerances, and build repeatable assemblies.'],['Structures & repairs','Test weak points, document failures, and make the next version stronger.']]},electrical:{label:'02 / Power',title:'Electrical',intro:'The team that gives the aircraft power, awareness, and a reliable nervous system.',description:'Electrical integrates every onboard connection required for a safe and capable UAV. The team makes sure the power system, flight controller, sensors, motors, radios, and payloads work reliably together.',areas:[['Power & propulsion','Select batteries, ESCs, motors, connectors, and power distribution.'],['Avionics & sensors','Integrate flight controllers, GPS, telemetry radios, and mission sensors.'],['Harnessing & diagnosis','Build clean wiring harnesses and find faults before a field test.']]},programming:{label:'03 / Code',title:'Programming',intro:'The team that turns hardware into a mission-capable UAV.',description:'Programming builds the software and workflow that support navigation, telemetry, data collection, and future autonomous missions. It works closely with Electrical and Integration & Testing to make each new capability dependable.',areas:[['Mission tools','Plan routes, configure vehicle behavior, and support ground-station workflows.'],['Telemetry & data','Collect, interpret, and visualize flight data for better decisions.'],['Autonomy foundations','Build toward sensing, mission logic, and computer-vision capability.']]},integration:{label:'04 / Verify',title:'Integration & Testing',intro:'The team that makes separate parts behave like one aircraft.',description:'Integration & Testing owns readiness. It brings hardware and software together, creates repeatable checks, captures evidence from testing, and makes the call on what is ready for the flight line.',areas:[['Bench integration','Verify every interface before the aircraft leaves the lab.'],['Test planning','Create checklists, test cards, and measurable success criteria.'],['Flight learning','Record results, identify issues, and feed clear findings back to each team.']]},operations:{label:'05 / Field',title:'Operations',intro:'The team that makes careful work possible at the field and beyond.',description:'Operations coordinates the human side of every mission: safety, logistics, roles, communication, outreach, and reliable flight-day routines. It protects the conditions the technical teams need to do their best work.',areas:[['Flight operations','Plan field days, define roles, and run safety and readiness procedures.'],['Logistics & communication','Manage equipment, schedules, documentation, and team coordination.'],['Outreach & representation','Prepare demonstrations and tell the team’s story to future members and partners.']]}};const key=new URLSearchParams(location.search).get('team')||'airframe',t=teams[key]||teams.airframe;document.title=t.title+' — Ithaca Aerial';label.textContent=t.label;title.textContent=t.title;intro.textContent=t.intro;description.textContent=t.description;areas.innerHTML=t.areas.map(a=>'<div><b>'+a[0]+'</b><p>'+a[1]+'</p></div>').join('');members.innerHTML='<div class="member"><b>Roster coming soon</b><span>—</span></div><div class="member"><b>Open to new members</b><span>Join us</span></div>';</script></body></html>
